<meta charset="utf-8">
<style>
:root{--font-sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;--color-text-primary:#2D2D2D;--color-text-secondary:#888780;--color-border-tertiary:#E5E3DC;}
body{margin:0;padding:28px;background:#F4F2EC;}
.sw{font-family:var(--font-sans);background:#FFFFFF;border-radius:14px;border:0.5px solid var(--color-border-tertiary);padding:3.5rem 2.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;text-align:center;max-width:860px;margin:0 auto;min-height:300px;}
.credit{background:#F1EFE8;border-radius:12px;padding:1.1rem 1.5rem;max-width:520px;}
.credit-row{font-size:11.5px;color:#5F5E5A;margin:0;line-height:1.6;}
.foot{border-top:0.5px solid var(--color-border-tertiary);padding-top:0.75rem;display:flex;justify-content:space-between;width:100%;}
.foot p{font-size:10px;color:var(--color-text-secondary);margin:0;}
</style>

<div class="sw">

  <div>
    <p style="font-size:30px;font-weight:600;color:var(--color-text-primary);letter-spacing:-0.03em;margin:0 0 8px;">Thank you</p>
    <p style="font-size:14px;color:var(--color-text-secondary);margin:0;">Questions?</p>
  </div>

  <div class="credit">
    <p class="credit-row"><strong style="color:#085041;">Victor Jalencas</strong> — designed and built MartechKit end-to-end, including the three pilot integrations.</p>
    <p class="credit-row" style="margin-top:8px;"><strong style="color:#2D2D2D;">David Sanchez &amp; team</strong> — shaped the initiative and the context behind it.</p>
  </div>

  <div class="foot">
    <p>MartechKit v1.0 · iOS live · Android &amp; Flutter next</p>
    <p style="font-weight:500;">MartechKit</p>
  </div>

</div>
