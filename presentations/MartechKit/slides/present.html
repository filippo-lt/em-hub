<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MartechKit — Present</title>
<style>
  :root{--teal:#5DCAA5;--bg:#1d1c1a;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;background:var(--bg);overflow:hidden;}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .canvas{transform-origin:center center;box-shadow:0 24px 70px rgba(0,0,0,0.5);border-radius:16px;overflow:hidden;background:#F4F2EC;}
  iframe{border:0;display:block;background:#F4F2EC;}

  /* click zones */
  .zone{position:fixed;top:0;bottom:0;width:20%;z-index:5;cursor:pointer;}
  .zone.left{left:0;}
  .zone.right{right:0;}

  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;color:#bdbbb4;font-size:12px;background:linear-gradient(to top,rgba(0,0,0,0.55),transparent);}
  .bar .title{flex:1;text-align:center;color:#e7e5de;font-weight:500;}
  .bar .presenter{font-size:10px;font-weight:600;padding:2px 9px;border-radius:100px;margin-left:8px;}
  .p-filippo{background:#E1F5EE;color:#085041;}
  .p-victor{background:#EEEDFE;color:#3C3489;}
  .btn{background:rgba(255,255,255,0.08);border:0;color:#e7e5de;width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .btn:hover{background:rgba(255,255,255,0.18);}
  .nav{display:flex;align-items:center;gap:6px;}
  .count{min-width:54px;text-align:center;font-variant-numeric:tabular-nums;}

  /* progress dots */
  .dots{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:10;}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.22);cursor:pointer;transition:all .15s;}
  .dot.active{background:var(--teal);transform:scale(1.35);}

  .hint{position:fixed;top:11px;right:16px;z-index:10;color:#6f6d67;font-size:10.5px;}
</style>
</head>
<body>

<div class="dots" id="dots"></div>
<div class="hint">← → arrows · F fullscreen</div>

<div class="stage">
  <div class="canvas" id="canvas"><iframe id="frame" title="slide" scrolling="no"></iframe></div>
</div>

<div class="zone left"  id="zleft"></div>
<div class="zone right" id="zright"></div>

<div class="bar">
  <div class="nav">
    <button class="btn" id="prev" title="Previous (←)">‹</button>
    <span class="count"><span id="cur">1</span> / <span id="total">10</span></span>
    <button class="btn" id="next" title="Next (→)">›</button>
  </div>
  <div class="title"><span id="slideTitle"></span><span class="presenter" id="presenter"></span></div>
  <button class="btn" id="fs" title="Fullscreen (F)">⛶</button>
</div>

<script>
  const slides = [
    {f:"slide_1_cover.html",            t:"Cover",                                p:"Filippo"},
    {f:"slide_2_wired_10_times.html",   t:"Same integration, wired 10 times",     p:"Filippo"},
    {f:"slide_3_what_it_costs.html",    t:"What that costs us",                   p:"Filippo"},
    {f:"slide_4_one_library.html",      t:"One library, single point",            p:"Filippo → Victor"},
    {f:"slide_5_facade.html",           t:"One clean API, vendors hidden inside", p:"Victor"},
    {f:"slide_6_event_dictionary.html", t:"The shared event dictionary",          p:"Victor"},
    {f:"slide_7_integration.html",      t:"Tickets → version bump",               p:"Victor"},
    {f:"slide_8_where_we_are.html",     t:"Live on iOS, validated in 3 pilots",   p:"Victor → Filippo"},
    {f:"slide_9_road_to_coverage.html", t:"The road to full coverage",            p:"Filippo"},
    {f:"slide_10_close.html",           t:"Thank you / Q&A",                      p:"Filippo"}
  ];

  // Design width of the slide canvas; card is centered within this.
  const DESIGN_W = 920;
  const BAR = 56;        // reserved vertical space for the bottom bar
  const MARGIN = 48;     // breathing room around the slide

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('canvas');
  const cur = document.getElementById('cur');
  const titleEl = document.getElementById('slideTitle');
  const presEl = document.getElementById('presenter');
  const dotsEl = document.getElementById('dots');
  document.getElementById('total').textContent = slides.length;

  let i = parseInt(location.hash.replace('#','')) || 1;
  if (i < 1 || i > slides.length) i = 1;

  slides.forEach((s, idx) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = s.t;
    d.onclick = () => go(idx + 1);
    dotsEl.appendChild(d);
  });

  function presenterClass(p){ return p.startsWith('Victor') ? 'p-victor' : 'p-filippo'; }

  // Size the canvas to the slide's real content height, then scale to fill the screen.
  function fit(){
    // Apply the design width FIRST so the slide lays out at full width before we measure.
    canvas.style.width = DESIGN_W + 'px';
    frame.style.width = DESIGN_W + 'px';

    // Measure the actual slide card, not the iframe viewport (scrollHeight can't report
    // shorter than the iframe height, which would inflate the result).
    let h = 640;
    try {
      const d = frame.contentDocument;
      const card = d && d.querySelector('.sw');
      if (card){
        h = Math.ceil(card.getBoundingClientRect().height) + 56; // + body padding (28*2)
      } else if (d && d.body){
        h = d.body.scrollHeight;
      }
    } catch(e){ /* cross-origin (file://) — fall back to default height */ }

    canvas.style.height = h + 'px';
    frame.style.height = h + 'px';

    const availW = window.innerWidth - MARGIN;
    const availH = window.innerHeight - BAR - MARGIN;
    const s = Math.min(availW / DESIGN_W, availH / h);
    canvas.style.transform = 'scale(' + s + ')';
  }

  function render(){
    const s = slides[i - 1];
    frame.src = s.f;
    cur.textContent = i;
    titleEl.textContent = s.t;
    presEl.textContent = s.p;
    presEl.className = 'presenter ' + presenterClass(s.p);
    [...dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === i - 1));
    location.hash = i;
  }

  function go(n){ i = Math.min(slides.length, Math.max(1, n)); render(); }
  function next(){ go(i + 1); }
  function prev(){ go(i - 1); }

  frame.addEventListener('load', () => { fit(); setTimeout(fit, 60); });
  window.addEventListener('resize', fit);

  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('zright').onclick = next;
  document.getElementById('zleft').onclick = prev;
  document.getElementById('fs').onclick = toggleFs;

  function toggleFs(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  window.addEventListener('hashchange', () => {
    const n = parseInt(location.hash.replace('#','')) || 1;
    if (n !== i) go(n);
  });

  window.addEventListener('keydown', (e) => {
    if (['ArrowRight',' ','PageDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(1);
    else if (e.key === 'End') go(slides.length);
    else if (e.key.toLowerCase() === 'f') toggleFs();
  });

  render();
</script>

</body>
</html>
