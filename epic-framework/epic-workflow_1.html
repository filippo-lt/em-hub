<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epic Workflow — Before &amp; After</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #FAF9F6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
    gap: 40px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1A1A19; }
  }

  header { text-align: center; }
  .eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    fill: #888780;
    opacity: 0.7;
  }

  .columns {
    display: flex;
    gap: 48px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: visible; }

  /* shared classes referenced in SVG */
  .th  { font-size: 13px; font-weight: 500; }
  .ts  { font-size: 11.5px; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.18em; opacity: 0.4; }
  .divider { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.5; }
  .col-label { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

  /* node colours – light */
  .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal   .th  { fill: #085041; }
  .c-teal   .ts  { fill: #0F6E56; }

  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th  { fill: #26215C; }
  .c-purple .ts  { fill: #534AB7; }

  .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .c-amber  .th  { fill: #633806; }
  .c-amber  .ts  { fill: #854F0B; }

  .c-red    rect { fill: #FDECEA; stroke: #C0392B; stroke-width: 0.5; }
  .c-red    .th  { fill: #7B1F17; }
  .c-red    .ts  { fill: #C0392B; }

  .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray   .th  { fill: #444441; }
  .c-gray   .ts  { fill: #5F5E5A; }

  /* node colours – dark */
  @media (prefers-color-scheme: dark) {
    .c-teal   rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal   .th  { fill: #9FE1CB; }
    .c-teal   .ts  { fill: #5DCAA5; }

    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th  { fill: #CECBF6; }
    .c-purple .ts  { fill: #AFA9EC; }

    .c-amber  rect { fill: #633806; stroke: #EF9F27; }
    .c-amber  .th  { fill: #FAC775; }
    .c-amber  .ts  { fill: #FAC775; }

    .c-red    rect { fill: #7B1F17; stroke: #E74C3C; }
    .c-red    .th  { fill: #F1A89E; }
    .c-red    .ts  { fill: #E74C3C; }

    .c-gray   rect { fill: #444441; stroke: #B4B2A9; }
    .c-gray   .th  { fill: #D3D1C7; }
    .c-gray   .ts  { fill: #B4B2A9; }

    .arr            { stroke: #B4B2A9; }
    .divider        { stroke: #5F5E5A; }
    .section-label  { opacity: 1; }
    .col-label      { }
  }
</style>
</head>
<body>

<!-- ═══════════════════════ page title ═══════════════════════ -->
<svg width="360" height="44" viewBox="0 0 360 44">
  <text class="eyebrow" x="180" y="14" text-anchor="middle" fill="#888780">Engineering Process</text>
  <text x="180" y="38" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" letter-spacing="-0.02em" fill="#1A1A19"
        style="fill: light-dark(#1A1A19, #D3D1C7);">
    Epic Workflow
    <tspan opacity="0.4" font-weight="400"> — Before &amp; After</tspan>
  </text>
</svg>

<div class="columns">

<!-- ════════════════════════ BEFORE ════════════════════════ -->
<svg width="300" viewBox="0 0 300 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- column label -->
  <text class="col-label" x="150" y="20" text-anchor="middle" fill="#C0392B">Before</text>

  <!-- section label -->
  <text class="section-label" x="150" y="38" text-anchor="middle" fill="#888780">COLLABORATIVE</text>

  <!-- PM -->
  <g class="c-teal">
    <rect x="40" y="48" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="67" text-anchor="middle" dominant-baseline="central">👤 PM</text>
    <text class="ts" x="150" y="85" text-anchor="middle" dominant-baseline="central">writes prompt → AI → PRD</text>
  </g>
  <line x1="150" y1="100" x2="150" y2="126" class="arr" marker-end="url(#aB)"/>

  <!-- PO 1 -->
  <g class="c-teal">
    <rect x="40" y="128" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="147" text-anchor="middle" dominant-baseline="central">👤 PO</text>
    <text class="ts" x="150" y="165" text-anchor="middle" dominant-baseline="central">feeds PRD → AI → Epic</text>
  </g>
  <line x1="150" y1="180" x2="150" y2="206" class="arr" marker-end="url(#aB)"/>

  <!-- EM -->
  <g class="c-teal">
    <rect x="40" y="208" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="227" text-anchor="middle" dominant-baseline="central">👤 EM</text>
    <text class="ts" x="150" y="245" text-anchor="middle" dominant-baseline="central">feeds Epic → AI → Estimates</text>
  </g>
  <line x1="150" y1="260" x2="150" y2="286" class="arr" marker-end="url(#aB)"/>

  <!-- PO 2 -->
  <g class="c-teal">
    <rect x="40" y="288" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="307" text-anchor="middle" dominant-baseline="central">👤 PO</text>
    <text class="ts" x="150" y="325" text-anchor="middle" dominant-baseline="central">feeds Epic → AI → User Stories</text>
  </g>
  <line x1="150" y1="340" x2="150" y2="366" class="arr" marker-end="url(#aB)"/>

  <!-- SE -->
  <g class="c-teal">
    <rect x="40" y="368" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="387" text-anchor="middle" dominant-baseline="central">👤 SE</text>
    <text class="ts" x="150" y="405" text-anchor="middle" dominant-baseline="central">receives User Stories</text>
  </g>
  <line x1="150" y1="420" x2="150" y2="446" class="arr" marker-end="url(#aR)"/>

  <!-- Pain point -->
  <g class="c-red">
    <rect x="40" y="448" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="467" text-anchor="middle" dominant-baseline="central">⚠ Manual translation</text>
    <text class="ts" x="150" y="485" text-anchor="middle" dominant-baseline="central">context lost — re-prompts AI</text>
  </g>
  <line x1="150" y1="500" x2="150" y2="526" class="arr" marker-end="url(#aB)"/>

  <!-- AI Coding Agent -->
  <g class="c-purple">
    <rect x="40" y="528" width="220" height="52" rx="8"/>
    <text class="th" x="150" y="547" text-anchor="middle" dominant-baseline="central">🤖 AI Coding Agent</text>
    <text class="ts" x="150" y="565" text-anchor="middle" dominant-baseline="central">generates code</text>
  </g>
  <line x1="150" y1="580" x2="150" y2="610" class="arr" marker-end="url(#aB)"/>

  <!-- Code output pill -->
  <g class="c-amber">
    <rect x="95" y="612" width="110" height="28" rx="14"/>
    <text class="ts" x="150" y="626" text-anchor="middle" dominant-baseline="central">💻 code</text>
  </g>

  <!-- legend -->
  <g transform="translate(40, 664)">
    <rect width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="ts" x="17" y="10" fill="#5F5E5A">human actor</text>
    <rect y="20" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="17" y="30" fill="#5F5E5A">AI / agent</text>
    <rect y="40" width="11" height="11" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="0.5"/>
    <text class="ts" x="17" y="50" fill="#5F5E5A">pain point</text>
    <rect y="60" width="11" height="11" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="ts" x="17" y="70" fill="#5F5E5A">artifact / output</text>
  </g>
</svg>


<!-- ════════════════════════ AFTER ════════════════════════ -->
<svg width="360" viewBox="0 0 360 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- column label -->
  <text class="col-label" x="170" y="20" text-anchor="middle" fill="#0F6E56">After</text>

  <!-- ─ COLLABORATIVE ─ -->
  <text class="section-label" x="170" y="38" text-anchor="middle" fill="#888780">COLLABORATIVE</text>

  <!-- PM -->
  <g class="c-teal">
    <rect x="50" y="48" width="220" height="52" rx="8"/>
    <text class="th" x="160" y="67" text-anchor="middle" dominant-baseline="central">👤 PM</text>
    <text class="ts" x="160" y="85" text-anchor="middle" dominant-baseline="central">writes prompt → AI → PRD</text>
  </g>
  <!-- PRD pill -->
  <line x1="270" y1="74" x2="294" y2="74" class="arr" marker-end="url(#aA)"/>
  <g class="c-amber">
    <rect x="296" y="60" width="52" height="28" rx="14"/>
    <text class="ts" x="322" y="74" text-anchor="middle" dominant-baseline="central">PRD</text>
  </g>

  <line x1="160" y1="100" x2="160" y2="124" class="arr" marker-end="url(#aA)"/>
  <text class="ts" x="173" y="116" fill="#BA7517" font-size="10.5">✓ approve</text>

  <!-- Epic Grooming -->
  <g class="c-teal">
    <rect x="50" y="126" width="220" height="68" rx="8"/>
    <text class="th" x="160" y="147" text-anchor="middle" dominant-baseline="central">🤝 Epic Grooming</text>
    <text class="ts" x="160" y="165" text-anchor="middle" dominant-baseline="central">PO + EM + SE</text>
    <text class="ts" x="160" y="182" text-anchor="middle" dominant-baseline="central" opacity="0.65">fills structured template</text>
  </g>
  <!-- Structured Epic pill -->
  <line x1="270" y1="160" x2="294" y2="160" class="arr" marker-end="url(#aA)"/>
  <g class="c-amber">
    <rect x="296" y="130" width="52" height="60" rx="8"/>
    <text class="ts" x="322" y="153" text-anchor="middle" dominant-baseline="central" font-size="10">Str.</text>
    <text class="ts" x="322" y="169" text-anchor="middle" dominant-baseline="central" font-size="10">Epic</text>
  </g>

  <line x1="160" y1="194" x2="160" y2="228" class="arr" marker-end="url(#aA)"/>
  <text class="ts" x="173" y="218" fill="#BA7517" font-size="10.5">✓ approve</text>

  <!-- divider -->
  <line x1="20" y1="222" x2="340" y2="222" class="divider"/>
  <text class="section-label" x="170" y="242" text-anchor="middle" fill="#888780">AUTONOMOUS</text>

  <!-- context feed lines from Structured Epic -->
  <line x1="322" y1="190" x2="322" y2="308" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.45"/>
  <line x1="322" y1="308" x2="272" y2="308" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.45" marker-end="url(#aA)"/>
  <line x1="322" y1="308" x2="322" y2="432" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.45"/>
  <line x1="322" y1="432" x2="272" y2="432" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.45" marker-end="url(#aA)"/>

  <!-- AI Agent -->
  <g class="c-purple">
    <rect x="50" y="252" width="220" height="68" rx="8"/>
    <text class="th" x="160" y="273" text-anchor="middle" dominant-baseline="central">🤖 AI Agent</text>
    <text class="ts" x="160" y="291" text-anchor="middle" dominant-baseline="central">engineering-controlled</text>
    <text class="ts" x="160" y="308" text-anchor="middle" dominant-baseline="central" opacity="0.65">Epic → Implementation Tasks</text>
  </g>
  <!-- tasks pill left -->
  <line x1="50" y1="286" x2="28" y2="286" class="arr" marker-end="url(#aA)"/>
  <g class="c-amber">
    <rect x="4" y="272" width="24" height="28" rx="6"/>
    <text class="ts" x="16" y="286" text-anchor="middle" dominant-baseline="central" font-size="10">⚙️</text>
  </g>

  <line x1="160" y1="320" x2="160" y2="364" class="arr" marker-end="url(#aA)"/>

  <!-- AI Coding Agent -->
  <g class="c-purple">
    <rect x="50" y="366" width="220" height="68" rx="8"/>
    <text class="th" x="160" y="387" text-anchor="middle" dominant-baseline="central">🤖 AI Coding Agent</text>
    <text class="ts" x="160" y="405" text-anchor="middle" dominant-baseline="central">generates code</text>
    <text class="ts" x="160" y="422" text-anchor="middle" dominant-baseline="central" opacity="0.65">supervised by SE</text>
  </g>
  <!-- code pill left -->
  <line x1="50" y1="400" x2="28" y2="400" class="arr" marker-end="url(#aA)"/>
  <g class="c-amber">
    <rect x="4" y="386" width="24" height="28" rx="6"/>
    <text class="ts" x="16" y="400" text-anchor="middle" dominant-baseline="central" font-size="10">💻</text>
  </g>

  <line x1="160" y1="434" x2="160" y2="470" class="arr" marker-end="url(#aA)"/>

  <!-- divider -->
  <line x1="20" y1="462" x2="340" y2="462" class="divider"/>
  <text class="section-label" x="170" y="482" text-anchor="middle" fill="#888780">COLLABORATIVE</text>

  <!-- Review (optional) -->
  <g class="c-teal">
    <rect x="50" y="494" width="220" height="52" rx="8" stroke-dasharray="6 4"/>
    <text class="th" x="160" y="513" text-anchor="middle" dominant-baseline="central">SE Review</text>
    <text class="ts" x="160" y="531" text-anchor="middle" dominant-baseline="central">tests pass ≠ looks right</text>
  </g>
  <text class="ts" x="278" y="522" fill="#888780" font-style="italic" font-size="10.5">optional</text>

  <line x1="160" y1="546" x2="160" y2="582" class="arr" marker-end="url(#aA)"/>

  <!-- Commit -->
  <g class="c-gray">
    <rect x="50" y="584" width="220" height="48" rx="8"/>
    <text class="th" x="160" y="602" text-anchor="middle" dominant-baseline="central">Commit</text>
    <text class="ts" x="160" y="620" text-anchor="middle" dominant-baseline="central">merge to main or PR</text>
  </g>

  <!-- legend -->
  <g transform="translate(50, 654)">
    <rect width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="ts" x="17" y="10" fill="#5F5E5A">human / collaborative</text>
    <rect y="20" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="17" y="30" fill="#5F5E5A">AI agent (autonomous)</text>
    <rect y="40" width="11" height="11" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="ts" x="17" y="50" fill="#5F5E5A">artifact / output</text>
    <line x1="0" y1="66" x2="11" y2="66" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
    <text class="ts" x="17" y="70" fill="#5F5E5A">context feed</text>
  </g>
</svg>

</div>
</body>
</html>
