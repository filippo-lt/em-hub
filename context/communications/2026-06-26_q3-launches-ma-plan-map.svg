<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" fill="#1f2933" font-size="26" font-weight="700">Q3 Launches + M&amp;A — Engineering Plan</text>
  <text x="40" y="68" fill="#5b6b7b" font-size="14">Exit both studios cleanly. Almost everything cuts end-July; the plan hinges on one app and three product calls.</text>

  <!-- Exit band -->
  <rect x="40" y="84" width="920" height="44" rx="8" fill="#f4f6f8" stroke="#d8dee4"/>
  <text x="58" y="111" fill="#1f2933" font-size="14" font-weight="700">EXITING:</text>
  <rect x="138" y="94" width="220" height="24" rx="12" fill="#eceff2" stroke="#c3ccd4"/>
  <text x="248" y="111" fill="#1f2933" font-size="12.5" text-anchor="middle">Helikanon · 4 apps</text>
  <rect x="372" y="94" width="180" height="24" rx="12" fill="#eceff2" stroke="#c3ccd4"/>
  <text x="462" y="111" fill="#1f2933" font-size="12.5" text-anchor="middle">TurboCat · PDF</text>
  <text x="942" y="111" fill="#c0392b" font-size="13.5" font-weight="700" text-anchor="end">target: end of July</text>

  <!-- Column headers -->
  <text x="40" y="160" fill="#5b6b7b" font-size="12" font-weight="700" letter-spacing="1">CRITICAL PATH</text>
  <text x="360" y="160" fill="#5b6b7b" font-size="12" font-weight="700" letter-spacing="1">ALREADY HANDLED</text>
  <text x="660" y="160" fill="#5b6b7b" font-size="12" font-weight="700" letter-spacing="1">DECIDE WITH SERGIO</text>

  <!-- ChatUltra (critical) -->
  <rect x="40" y="170" width="300" height="158" rx="10" fill="#fbeeec" stroke="#c0392b" stroke-width="2"/>
  <text x="58" y="198" fill="#1f2933" font-size="18" font-weight="700">ChatUltra</text>
  <text x="58" y="218" fill="#5b6b7b" font-size="12">P1 · Flutter · revenue · on Helikanon</text>
  <line x1="58" y1="230" x2="322" y2="230" stroke="#e3c9c5"/>
  <text x="58" y="252" fill="#1f2933" font-size="12.5" font-weight="600">Plan: external Flutter team</text>
  <text x="58" y="270" fill="#5b6b7b" font-size="12">(Anadea / Gilzor) + internal advisor.</text>
  <text x="58" y="294" fill="#1f2933" font-size="12.5" font-weight="600">Helikanon leaves only once</text>
  <text x="58" y="312" fill="#5b6b7b" font-size="12">the team is in place (paid KT overlap).</text>

  <!-- Truth Seeker (handled) -->
  <rect x="360" y="170" width="280" height="74" rx="10" fill="#e7f1e9" stroke="#4f8a5b" stroke-width="1.5"/>
  <text x="378" y="196" fill="#1f2933" font-size="15" font-weight="700">Truth Seeker</text>
  <text x="378" y="216" fill="#5b6b7b" font-size="12">Web pivot — internal (Andrey + Oscar QA).</text>
  <text x="378" y="233" fill="#5b6b7b" font-size="12">Off Helikanon. No dependency.</text>

  <!-- AI Design (handled) -->
  <rect x="360" y="254" width="280" height="74" rx="10" fill="#e7f1e9" stroke="#4f8a5b" stroke-width="1.5"/>
  <text x="378" y="280" fill="#1f2933" font-size="15" font-weight="700">AI Design</text>
  <text x="378" y="300" fill="#5b6b7b" font-size="12">Stays as-is — Anadea team + Vlad advisor.</text>
  <text x="378" y="317" fill="#5b6b7b" font-size="12">No change.</text>

  <!-- PDF (decide) -->
  <rect x="660" y="170" width="300" height="74" rx="10" fill="#f7efe0" stroke="#c08a2e" stroke-width="1.5"/>
  <text x="678" y="196" fill="#1f2933" font-size="15" font-weight="700">PDF (Android) · TurboCat</text>
  <text x="678" y="216" fill="#5b6b7b" font-size="12">Q: after launch — live or die?</text>
  <text x="678" y="233" fill="#5b6b7b" font-size="12">If it lives, it's a 2nd Flutter app to home.</text>

  <!-- FaceAI (decide) -->
  <rect x="660" y="254" width="300" height="74" rx="10" fill="#f7efe0" stroke="#c08a2e" stroke-width="1.5"/>
  <text x="678" y="280" fill="#1f2933" font-size="15" font-weight="700">FaceAI</text>
  <text x="678" y="300" fill="#5b6b7b" font-size="12">Q: more scope after July launch?</text>
  <text x="678" y="317" fill="#5b6b7b" font-size="12">Answer frees Vlad — or keeps him.</text>

  <!-- Sunset strip -->
  <rect x="40" y="344" width="920" height="50" rx="10" fill="#f4f6f8" stroke="#d8dee4"/>
  <text x="58" y="375" fill="#1f2933" font-size="13.5" font-weight="700">SUNSET before the exit:</text>
  <text x="240" y="375" fill="#5b6b7b" font-size="13">Music Player (easy kill) · Step Counter (decide) — don't leave them orphaned when Helikanon walks.</text>

  <!-- Timeline -->
  <text x="40" y="430" fill="#5b6b7b" font-size="12" font-weight="700" letter-spacing="1">TIMELINE</text>
  <line x1="180" y1="452" x2="940" y2="452" stroke="#d8dee4"/>
  <text x="200" y="446" fill="#5b6b7b" font-size="11" text-anchor="middle">now</text>
  <text x="640" y="446" fill="#5b6b7b" font-size="11" text-anchor="middle">end-July</text>
  <text x="860" y="446" fill="#5b6b7b" font-size="11" text-anchor="middle">mid-Aug</text>
  <line x1="640" y1="452" x2="640" y2="560" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="486" fill="#1f2933" font-size="12.5" font-weight="600">TurboCat + sunsets</text>
  <rect x="180" y="474" width="460" height="22" rx="6" fill="#4f8a5b"/>
  <text x="410" y="489" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="600">clean cut — END-JULY</text>

  <text x="40" y="524" fill="#1f2933" font-size="12.5" font-weight="600">ChatUltra team ramp + KT</text>
  <rect x="180" y="512" width="600" height="22" rx="6" fill="#c08a2e"/>
  <text x="480" y="527" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="600">source team → ramp → KT overlap</text>

  <text x="40" y="552" fill="#1f2933" font-size="12.5" font-weight="600">Helikanon exits ChatUltra</text>
  <rect x="780" y="540" width="90" height="22" rx="6" fill="#1f2933"/>
  <text x="825" y="555" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="600">~early-Aug</text>

  <!-- Footer commitment -->
  <rect x="40" y="586" width="920" height="52" rx="10" fill="#eef2f7" stroke="#3a6ea5"/>
  <text x="58" y="610" fill="#3a6ea5" font-size="13" font-weight="700">THE COMMITMENT</text>
  <text x="220" y="610" fill="#1f2933" font-size="13">TurboCat + sunsets <tspan font-weight="700">end-July</tspan>. Helikanon / ChatUltra <tspan font-weight="700">early-August</tspan>, gated on the Flutter team.</text>
  <text x="220" y="630" fill="#5b6b7b" font-size="12">Open: PDF live/die · FaceAI scope (→ Vlad) · launch calendar reconciled — all to confirm with Sergio.</text>
</svg>
