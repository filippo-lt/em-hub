# Warning definitions for roadmap-status.
# Each section is a warning type. Fields:
#   title       = heading shown in reports
#   description = one-line explanation of what this warning catches

[not_started]
title = Epic Not Started
description = Epic is Open/Created but has children already In Progress. The epic status needs updating.

[ready_close]
title = Ready to Close
description = All children are done but the epic is still open. Someone should close it.

[no_date]
title = No Due Date
description = Open epic with no target or due date set. Hard to track delivery without a date.

[empty]
title = Empty Epic
description = Epic is In Progress but has no child stories. Either add stories or close the epic.

[at_risk]
title = At Risk
description = Due within 2 weeks with less than 50% of story points completed. Items without story points are free and don't count toward risk.

[due_not_started]
title = Due But Not Started
description = Due within 2 weeks (or already overdue) but epic status is still Created/Open/Approved. Work hasn't begun.
