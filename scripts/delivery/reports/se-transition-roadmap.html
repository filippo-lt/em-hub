<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE Transition Roadmap — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080810;
  --surface:#0F0F18;
  --surface2:#15151F;
  --border:#1E1E2E;
  --grid:#141420;
  --grid-strong:#1C1C2C;
  --text:#D8D8EE;
  --text2:#7070A0;
  --text3:#3A3A60;
  --today:#FF4466;
  --milestone:#FFD060;
  --vlad:#00C9A7;
  --vlad-bg:rgba(0,201,167,0.10);
  --vlad-stripe:rgba(0,201,167,0.04);
  --andrey:#F5A623;
  --andrey-bg:rgba(245,166,35,0.10);
  --andrey-stripe:rgba(245,166,35,0.04);
  --advisor:#B06EF5;
  --advisor-bg:rgba(176,110,245,0.10);
  --advisor-stripe:rgba(176,110,245,0.04);
  --lw:220px;
  --rh:38px;
  --ph:46px;
  --hh:58px;
  --ww:52px;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;user-select:none}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh}

#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.app-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.15em;color:var(--text);text-transform:uppercase}
.app-subtitle{font-size:10px;color:var(--text2);margin-left:14px;letter-spacing:0.06em}
.topbar-left{display:flex;align-items:baseline;gap:0}
.topbar-right{display:flex;align-items:center;gap:10px}

.btn{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  padding:5px 12px;border-radius:3px;cursor:pointer;letter-spacing:0.06em;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);
  transition:all 0.15s;
}
.btn:hover{color:var(--text);border-color:var(--text3)}
.btn-danger{border-color:#FF4466;color:#FF4466}
.btn-danger:hover{background:rgba(255,68,102,0.1)}

/* ── ROADMAP CONTAINER ── */
#roadmap{
  flex:1;overflow:auto;position:relative;
  background:var(--bg);
}
#roadmap-inner{
  position:relative;
  min-height:100%;
}

/* ── HEADER ROW ── */
.header-row{
  position:sticky;top:0;z-index:50;
  display:flex;height:var(--hh);
  background:var(--surface);border-bottom:1px solid var(--border);
}
.corner{
  position:sticky;left:0;z-index:60;
  width:var(--lw);min-width:var(--lw);
  display:flex;align-items:center;padding:0 16px;
  background:var(--surface);border-right:1px solid var(--border);
  flex-shrink:0;
}
.corner-label{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--text2);letter-spacing:0.12em;text-transform:uppercase}

.week-header-area{
  position:relative;display:flex;flex-direction:column;
}
.month-row{display:flex;height:22px;border-bottom:1px solid var(--border)}
.month-cell{
  display:flex;align-items:center;padding:0 10px;
  border-right:1px solid var(--border);
  font-size:10px;font-weight:600;color:var(--text2);letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;
}
.week-row{display:flex;height:36px;position:relative}
.week-cell{
  width:var(--ww);min-width:var(--ww);
  display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--grid);flex-shrink:0;
  font-size:9px;color:var(--text3);letter-spacing:0.04em;cursor:default;
  position:relative;
}
.week-cell.current-week{background:rgba(255,255,255,0.025)}
.week-cell.current-week .week-label{color:rgba(255,255,255,0.4)}
.week-label{pointer-events:none}

/* milestone diamond in header */
.milestone-pin{
  position:absolute;bottom:6px;
  width:10px;height:10px;
  background:var(--milestone);
  transform:rotate(45deg) translateX(-50%);
  cursor:ew-resize;
  z-index:10;
  transition:transform 0.1s;
}
.milestone-pin:hover{transform:rotate(45deg) translateX(-50%) scale(1.4)}
.milestone-pin-wrap{
  position:absolute;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;z-index:9;
}
.milestone-pin-wrap.draggable{pointer-events:auto;cursor:ew-resize}
.milestone-label{
  font-size:8px;color:var(--milestone);letter-spacing:0.05em;
  white-space:nowrap;margin-bottom:2px;text-align:center;line-height:1.2;
  pointer-events:none;
}

/* ── PERSON SECTION ── */
.person-section{border-bottom:1px solid var(--border)}
.person-header-row{
  display:flex;height:var(--ph);
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.person-header-row:hover .person-left{background:var(--surface2)}
.person-left{
  position:sticky;left:0;z-index:20;
  width:var(--lw);min-width:var(--lw);
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--surface);border-right:1px solid var(--border);
  transition:background 0.1s;flex-shrink:0;
}
.collapse-btn{
  font-size:9px;color:var(--text2);background:none;border:none;cursor:pointer;
  width:14px;text-align:center;transition:transform 0.2s;flex-shrink:0;
}
.collapse-btn.open{transform:rotate(0deg)}
.collapse-btn.closed{transform:rotate(-90deg)}
.person-name{
  font-family:'Syne',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;
}
.person-stripe{
  flex:1;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--ww) - 1px),var(--grid) calc(var(--ww) - 1px),var(--grid) var(--ww));
}

/* ── BAR ROW ── */
.bar-row{display:flex;height:var(--rh);border-bottom:1px solid var(--grid)}
.bar-row:last-child{border-bottom:none}
.bar-label-cell{
  position:sticky;left:0;z-index:20;
  width:var(--lw);min-width:var(--lw);
  display:flex;align-items:center;padding:0 10px 0 32px;
  background:var(--surface);border-right:1px solid var(--border);
  flex-shrink:0;cursor:default;
}
.bar-label-text{
  font-size:10px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0.03em;
}
.bar-timeline-cell{
  flex:1;position:relative;height:100%;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--ww) - 1px),var(--grid) calc(var(--ww) - 1px),var(--grid) var(--ww));
}
.bar-timeline-cell.cw-highlight{
  background-image:
    linear-gradient(var(--current-week-bg,transparent) 100%,transparent 100%),
    repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--ww) - 1px),var(--grid) calc(var(--ww) - 1px),var(--grid) var(--ww));
}

/* ── GANTT BAR ── */
.gantt-bar{
  position:absolute;top:6px;height:26px;
  display:flex;align-items:center;
  border-radius:3px;overflow:visible;
  cursor:grab;transition:box-shadow 0.1s,filter 0.1s;
  min-width:calc(var(--ww) - 4px);
}
.gantt-bar:hover{box-shadow:0 2px 12px rgba(0,0,0,0.4);filter:brightness(1.1)}
.gantt-bar:active{cursor:grabbing}
.gantt-bar.dragging{opacity:0.5;cursor:grabbing}

.bar-bg{
  position:absolute;inset:0;border-radius:3px;
  border-left:3px solid;
}
.bar-inner{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 8px;width:100%;gap:6px;overflow:hidden;
}
.bar-text{
  font-size:10px;font-weight:600;letter-spacing:0.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:rgba(255,255,255,0.85);flex:1;min-width:0;
}
.status-badge{
  font-size:8px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  padding:2px 5px;border-radius:2px;border:1px solid;white-space:nowrap;flex-shrink:0;
}
.resize-handle{
  position:absolute;right:0;top:0;bottom:0;width:8px;
  cursor:ew-resize;z-index:10;
}
.resize-handle::after{
  content:'';position:absolute;right:2px;top:50%;transform:translateY(-50%);
  width:2px;height:10px;border-radius:1px;
  background:rgba(255,255,255,0.25);transition:background 0.1s;
}
.resize-handle:hover::after{background:rgba(255,255,255,0.6)}

/* Status colors */
.status-trial{--s-bg:rgba(245,158,11,0.15);--s-border:#F59E0B;--s-text:#F59E0B}
.status-active{--s-bg:rgba(16,185,129,0.15);--s-border:#10B981;--s-text:#10B981}
.status-deferred{--s-bg:rgba(107,114,128,0.1);--s-border:#4B5563;--s-text:#6B7280}
.status-leave{--s-bg:rgba(96,165,250,0.15);--s-border:#60A5FA;--s-text:#60A5FA}
.gantt-bar .status-badge{background:var(--s-bg);border-color:var(--s-border);color:var(--s-text)}

/* ── TODAY LINE ── */
#today-line{
  position:absolute;top:0;bottom:0;width:1px;pointer-events:none;z-index:40;
  background:var(--today);
  box-shadow:0 0 8px rgba(255,68,102,0.5);
}
#today-line::before{
  content:'TODAY';position:absolute;top:0;left:4px;
  font-size:8px;font-weight:600;color:var(--today);letter-spacing:0.08em;
}

/* ── DRAG GHOST ── */
#drag-ghost{
  position:fixed;pointer-events:none;z-index:1000;
  height:26px;display:flex;align-items:center;
  border-radius:3px;padding:0 10px;
  font-size:10px;font-weight:600;color:rgba(255,255,255,0.9);
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
  transition:none;
  display:none;
}
#drag-ghost.visible{display:flex}

/* ── DROP TARGET HIGHLIGHT ── */
.person-section.drop-target .person-left{background:var(--surface2);outline:2px solid rgba(255,255,255,0.2)}
.person-section.drop-target .bar-timeline-cell{background-color:rgba(255,255,255,0.03)}

/* ── EDIT POPUP ── */
#edit-popup{
  position:fixed;z-index:500;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);min-width:220px;
}
#edit-popup.hidden{display:none}
.edit-row{display:flex;gap:6px;align-items:center}
.edit-row label{font-size:9px;color:var(--text2);letter-spacing:0.06em;min-width:46px}
#edit-label{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:5px 8px;outline:none;
}
#edit-label:focus{border-color:var(--text3)}
#edit-status{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;
  padding:4px 6px;outline:none;cursor:pointer;
}
.edit-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:2px}
.edit-actions .btn{font-size:9px;padding:4px 10px}
.btn-primary{background:rgba(255,255,255,0.07);color:var(--text);border-color:var(--text3)}
.btn-primary:hover{background:rgba(255,255,255,0.12)}

/* ── PERSON DROP ZONES ── */
.person-drop-zone{
  position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:transparent;z-index:15;transition:background 0.1s;
}
.person-section.drop-active .person-drop-zone{
  pointer-events:auto;
  background:rgba(255,255,255,0.025);
}

/* ── CURRENT WEEK COLUMN ── */
.cw-col{
  position:absolute;top:0;bottom:0;pointer-events:none;
  background:rgba(255,255,255,0.018);z-index:0;
}

/* ── ROW DRAG HANDLE ── */
.row-drag-handle{
  width:14px;flex-shrink:0;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  color:var(--text3);font-size:9px;letter-spacing:-1px;
  transition:color 0.1s;margin-right:4px;
}
.row-drag-handle:hover{color:var(--text2)}
.row-drag-handle:active{cursor:grabbing}

/* ── DROP INDICATOR ── */
#drop-indicator{
  position:fixed;pointer-events:none;z-index:200;
  left:0;right:0;height:2px;
  background:rgba(255,255,255,0.5);
  box-shadow:0 0 6px rgba(255,255,255,0.3);
  display:none;
}
#drop-indicator.visible{display:block}

/* ── ADD ITEM BUTTON ── */
.add-item-btn{
  display:flex;align-items:center;gap:5px;
  height:30px;padding:0 10px 0 32px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--text3);background:none;border:none;
  cursor:pointer;letter-spacing:0.06em;width:var(--lw);
  border-right:1px solid var(--border);
  transition:color 0.1s;text-align:left;
  position:sticky;left:0;z-index:20;
  background:var(--surface);
}
.add-item-btn:hover{color:var(--text2)}
.add-item-row{
  display:flex;height:30px;border-top:1px dashed var(--border);
}
.add-item-row .add-item-timeline{
  flex:1;border-right:none;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--ww) - 1px),var(--grid) calc(var(--ww) - 1px),var(--grid) var(--ww));
}

@media print{
  #topbar .btn{display:none}
  #app,#roadmap,#roadmap-inner,html,body{overflow:visible;height:auto}
  #roadmap{overflow:visible}
  .header-row{position:relative}
  .person-left,.bar-label-cell,.corner{position:relative}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="topbar-left">
      <span class="app-title">SE Transition Roadmap</span>
      <span class="app-subtitle">2026 — drag bars to reschedule · drag between rows to reassign · dbl-click to edit</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-danger" id="reset-btn">Reset</button>
      <button class="btn" id="export-btn">⎙ Export</button>
    </div>
  </div>
  <div id="roadmap">
    <div id="roadmap-inner"></div>
  </div>
</div>

<div id="drag-ghost"></div>
<div id="drop-indicator"></div>
<div id="edit-popup" class="hidden">
  <div class="edit-row"><label>Label</label><input id="edit-label" type="text" spellcheck="false"></div>
  <div class="edit-row"><label>Status</label>
    <select id="edit-status">
      <option value="Trial">Trial</option>
      <option value="Active">Active</option>
      <option value="Deferred">Deferred</option>
      <option value="Leave">On Leave</option>
    </select>
  </div>
  <div class="edit-actions">
    <button class="btn" id="edit-cancel">Cancel</button>
    <button class="btn btn-primary" id="edit-confirm">Save</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const WEEK_W = 52;
const LEFT_W = 220;
const TOTAL_WEEKS = 30;
const START = new Date('2026-03-09T00:00:00');
const TODAY = new Date('2026-03-12T00:00:00');

const PERSON_COLORS = {
  vlad:    { bar:'#00C9A7', bg:'rgba(0,201,167,0.10)',   stripe:'rgba(0,201,167,0.04)'   },
  andrey:  { bar:'#F5A623', bg:'rgba(245,166,35,0.10)',  stripe:'rgba(245,166,35,0.04)'  },
  advisor: { bar:'#B06EF5', bg:'rgba(176,110,245,0.10)', stripe:'rgba(176,110,245,0.04)' },
};

// ═══════════════════════════════════════════════
// DEFAULT STATE
// ═══════════════════════════════════════════════
const DEFAULT = {
  people: [
    { id:'vlad',    name:'Vlad',        collapsed:false },
    { id:'andrey',  name:'Andrey',      collapsed:false },
    { id:'advisor', name:'New Advisor', collapsed:false },
  ],
  bars: [
    { id:'b1',  personId:'vlad',    label:'FaceAI iOS',                startWeek:0,  weeks:4,  status:'Trial'    },
    { id:'b2',  personId:'vlad',    label:'FaceAI Backend',            startWeek:5,  weeks:6,  status:'Active'   },
    { id:'b3',  personId:'vlad',    label:'AI Design iOS',             startWeek:12, weeks:6,  status:'Deferred' },
    { id:'b4',  personId:'vlad',    label:'AI Design Android+Backend', startWeek:19, weeks:8,  status:'Deferred' },
    { id:'b5',  personId:'andrey',  label:'iMote Library',             startWeek:0,  weeks:3,  status:'Active'   },
    { id:'b6',  personId:'andrey',  label:'iMote iOS',                 startWeek:3,  weeks:6,  status:'Active'   },
    { id:'b7',  personId:'andrey',  label:'Paternity Leave',           startWeek:6,  weeks:2,  status:'Leave'    },
    { id:'b8',  personId:'andrey',  label:'iMote Android',             startWeek:9,  weeks:5,  status:'Active'   },
    { id:'b9',  personId:'andrey',  label:'ScreenMirroring iOS+BE',    startWeek:14, weeks:8,  status:'Active'   },
    { id:'b10', personId:'advisor', label:'Advisor Duties',            startWeek:9,  weeks:16, status:'Active'   },
    { id:'b11', personId:'advisor', label:'AI Chat Ultra',             startWeek:9,  weeks:12, status:'Active'   },
  ],
  milestones: [
    { id:'m1', week:0,  label:'Role shift\n+ Presentation', frac:0.4 },
    { id:'m2', week:4,  label:'Vlad trial\ncheckpoint',      frac:0.3 },
    { id:'m3', week:9,  label:'Advisor\njoins',              frac:0.1 },
  ],
};

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
function loadState() {
  try {
    const saved = localStorage.getItem('se-roadmap-v3');
    if (saved) return JSON.parse(saved);
  } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function saveState() {
  localStorage.setItem('se-roadmap-v3', JSON.stringify(state));
}
let state = loadState();

// ═══════════════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════════════
function weekToDate(w) {
  const d = new Date(START);
  d.setDate(d.getDate() + w * 7);
  return d;
}
function todayOffset() {
  return (TODAY - START) / (7 * 24 * 3600 * 1000);
}
function fmtWeekDate(w) {
  return weekToDate(w).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function getMonthGroups() {
  const groups = [];
  let cur = null;
  for (let w = 0; w < TOTAL_WEEKS; w++) {
    const d = weekToDate(w);
    const key = d.getFullYear() + '-' + d.getMonth();
    if (key !== (cur && cur.key)) {
      cur = { key, label: d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}), count:0 };
      groups.push(cur);
    }
    cur.count++;
  }
  return groups;
}
function currentWeekIndex() {
  return Math.floor(todayOffset());
}

// ═══════════════════════════════════════════════
// TODAY LINE — created once, moved on each render
// ═══════════════════════════════════════════════
const todayLineEl = document.createElement('div');
todayLineEl.id = 'today-line';

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  const inner = document.getElementById('roadmap-inner');
  inner.innerHTML = '';
  inner.style.width = (LEFT_W + TOTAL_WEEKS * WEEK_W) + 'px';

  inner.appendChild(buildHeader());
  for (const person of state.people) inner.appendChild(buildPerson(person));

  todayLineEl.style.left = (LEFT_W + todayOffset() * WEEK_W) + 'px';
  inner.appendChild(todayLineEl);
}

function buildHeader() {
  const row = document.createElement('div');
  row.className = 'header-row';

  const corner = document.createElement('div');
  corner.className = 'corner';
  corner.innerHTML = '<span class="corner-label">Roadmap</span>';
  row.appendChild(corner);

  const area = document.createElement('div');
  area.className = 'week-header-area';
  area.style.cssText = `width:${TOTAL_WEEKS * WEEK_W}px;position:relative`;

  const monthRow = document.createElement('div');
  monthRow.className = 'month-row';
  for (const g of getMonthGroups()) {
    const c = document.createElement('div');
    c.className = 'month-cell';
    c.style.width = (g.count * WEEK_W) + 'px';
    c.textContent = g.label;
    monthRow.appendChild(c);
  }
  area.appendChild(monthRow);

  const weekRow = document.createElement('div');
  weekRow.className = 'week-row';
  const cwi = currentWeekIndex();
  for (let w = 0; w < TOTAL_WEEKS; w++) {
    const c = document.createElement('div');
    c.className = 'week-cell' + (w === cwi ? ' current-week' : '');
    c.innerHTML = `<span class="week-label">${fmtWeekDate(w)}</span>`;
    weekRow.appendChild(c);
  }
  area.appendChild(weekRow);

  for (const m of state.milestones) {
    const frac = m.frac || 0;
    const x = (m.week + frac) * WEEK_W;
    const wrap = document.createElement('div');
    wrap.className = 'milestone-pin-wrap draggable';
    wrap.style.cssText = `position:absolute;bottom:0;left:${x}px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center`;
    wrap.dataset.milestoneId = m.id;
    const lines = m.label.split('\n');
    wrap.innerHTML = `<div class="milestone-label">${lines.map(l=>`<div>${l}</div>`).join('')}</div><div class="milestone-pin"></div>`;
    area.appendChild(wrap);
  }

  row.appendChild(area);
  return row;
}

function buildPerson(person) {
  const pc = PERSON_COLORS[person.id] || PERSON_COLORS.vlad;
  const section = document.createElement('div');
  section.className = 'person-section';
  section.dataset.personId = person.id;

  // Header row
  const hrow = document.createElement('div');
  hrow.className = 'person-header-row';
  hrow.dataset.personId = person.id;

  const left = document.createElement('div');
  left.className = 'person-left';
  left.style.borderLeft = `3px solid ${pc.bar}`;
  left.innerHTML = `
    <button class="collapse-btn ${person.collapsed?'closed':'open'}" data-person-id="${person.id}">▼</button>
    <span class="person-name" data-person-id="${person.id}" style="color:${pc.bar}" title="Double-click to rename">${person.name}</span>
  `;

  const stripe = document.createElement('div');
  stripe.className = 'person-stripe';
  stripe.style.cssText = `flex:1;height:100%;background-color:${pc.stripe};background-image:repeating-linear-gradient(90deg,transparent 0,transparent ${WEEK_W-1}px,rgba(255,255,255,0.04) ${WEEK_W-1}px,rgba(255,255,255,0.04) ${WEEK_W}px)`;

  hrow.appendChild(left);
  hrow.appendChild(stripe);
  section.appendChild(hrow);

  // Bar rows + add button (hidden when collapsed)
  if (!person.collapsed) {
    const bars = state.bars.filter(b => b.personId === person.id);
    const barRows = document.createElement('div');
    barRows.className = 'bar-rows';
    barRows.dataset.personId = person.id;
    for (const bar of bars) barRows.appendChild(buildBarRow(bar, pc));
    section.appendChild(barRows);

    // "＋ Add item" row
    const addRow = document.createElement('div');
    addRow.className = 'add-item-row';
    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.dataset.personId = person.id;
    addBtn.innerHTML = `<span style="font-size:12px;line-height:1">+</span> Add item`;
    const addTimeline = document.createElement('div');
    addTimeline.className = 'add-item-timeline';
    addTimeline.style.width = (TOTAL_WEEKS * WEEK_W) + 'px';
    addRow.appendChild(addBtn);
    addRow.appendChild(addTimeline);
    section.appendChild(addRow);
  }

  return section;
}

function buildBarRow(bar, pc) {
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.dataset.barId = bar.id;

  const labelCell = document.createElement('div');
  labelCell.className = 'bar-label-cell';
  labelCell.dataset.barId = bar.id;
  labelCell.style.borderLeft = `3px solid ${pc.bar}22`;
  labelCell.title = 'Drag ⠿ to reorder · Double-click to edit';
  labelCell.innerHTML = `<span class="row-drag-handle" data-bar-id="${bar.id}" title="Drag to reorder">⠿</span><span class="bar-label-text">${bar.label}</span>`;
  row.appendChild(labelCell);

  const tlCell = document.createElement('div');
  tlCell.className = 'bar-timeline-cell';
  tlCell.style.width = (TOTAL_WEEKS * WEEK_W) + 'px';

  const cwi = currentWeekIndex();
  if (cwi >= 0 && cwi < TOTAL_WEEKS) {
    const cwCol = document.createElement('div');
    cwCol.className = 'cw-col';
    cwCol.style.cssText = `left:${cwi * WEEK_W}px;width:${WEEK_W}px`;
    tlCell.appendChild(cwCol);
  }

  tlCell.appendChild(buildBar(bar, pc));
  row.appendChild(tlCell);
  return row;
}

function statusCls(s) {
  return 'status-' + ({Trial:'trial',Active:'active',Deferred:'deferred',Leave:'leave','On Leave':'leave'}[s] || 'active');
}
function statusLbl(s) {
  return ({Trial:'TRIAL',Active:'ACTIVE',Deferred:'DEFERRED',Leave:'LEAVE','On Leave':'LEAVE'}[s] || s).toUpperCase();
}

function buildBar(bar, pc) {
  const isLeave = bar.status === 'Leave' || bar.status === 'On Leave';
  const isDeferred = bar.status === 'Deferred';
  const barColor = isLeave ? '#60A5FA' : (isDeferred ? '#4B5563' : pc.bar);
  const barBg    = isLeave ? 'rgba(96,165,250,0.12)' : (isDeferred ? 'rgba(75,85,99,0.12)' : pc.bg);

  const el = document.createElement('div');
  el.className = `gantt-bar ${statusCls(bar.status)}`;
  el.dataset.barId = bar.id;
  el.style.cssText = `left:${bar.startWeek * WEEK_W + 2}px;width:${Math.max(WEEK_W - 4, bar.weeks * WEEK_W - 4)}px`;
  el.innerHTML = `
    <div class="bar-bg" style="background:${barBg};border-left-color:${barColor}${isDeferred?';opacity:0.7':''}"></div>
    <div class="bar-inner">
      <span class="bar-text">${bar.label}</span>
      <span class="status-badge">${statusLbl(bar.status)}</span>
    </div>
    <div class="resize-handle" data-bar-id="${bar.id}"></div>
  `;
  return el;
}

// ═══════════════════════════════════════════════
// INTERACTION STATE
// ═══════════════════════════════════════════════
let dragState = null;    // bar date-drag (horizontal)
let rowDragState = null; // row reorder drag (vertical)
let resizeState = null;  // bar resize
let milState = null;     // milestone drag
let editBarId = null;    // which bar is being edited

// ═══════════════════════════════════════════════
// ADD BAR
// ═══════════════════════════════════════════════
function addBar(personId) {
  const id = 'b' + Date.now();
  const newBar = {
    id, personId,
    label: 'New Item',
    startWeek: Math.max(0, currentWeekIndex()),
    weeks: 2,
    status: 'Active',
  };
  state.bars.push(newBar);
  saveState();
  render();
  // Open edit popup immediately — find the bar element
  const barEl = document.querySelector(`.gantt-bar[data-bar-id="${id}"]`);
  const rect = barEl ? barEl.getBoundingClientRect() : { left: 300, top: 300 };
  openEdit(id, rect.left, rect.top);
}

// ═══════════════════════════════════════════════
// ROW REORDER HELPERS
// ═══════════════════════════════════════════════
function getDropRowIndex(personId, clientY) {
  const section = document.querySelector(`.person-section[data-person-id="${personId}"]`);
  if (!section) return 0;
  const rows = [...section.querySelectorAll('.bar-row')];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (clientY < r.top + r.height / 2) return i;
  }
  return rows.length;
}

function showDropIndicator(clientY) {
  const ind = document.getElementById('drop-indicator');
  ind.style.top = (clientY - 1) + 'px';
  ind.classList.add('visible');
}
function hideDropIndicator() {
  document.getElementById('drop-indicator').classList.remove('visible');
}

// ═══════════════════════════════════════════════
// GHOST
// ═══════════════════════════════════════════════
function showGhost(bar, e) {
  const g = document.getElementById('drag-ghost');
  const pc = PERSON_COLORS[bar.personId] || PERSON_COLORS.vlad;
  g.style.cssText = `background:${pc.bg};border:2px solid ${pc.bar};width:${Math.max(WEEK_W-4, bar.weeks*WEEK_W-4)}px;left:${e.clientX+10}px;top:${e.clientY-13}px`;
  g.textContent = bar.label;
  g.classList.add('visible');
}
function moveGhost(e) {
  const g = document.getElementById('drag-ghost');
  g.style.left = (e.clientX + 10) + 'px';
  g.style.top  = (e.clientY - 13) + 'px';
}
function hideGhost() {
  document.getElementById('drag-ghost').classList.remove('visible');
}

// ═══════════════════════════════════════════════
// PERSON-AT-Y using getBoundingClientRect
// ═══════════════════════════════════════════════
function personAtClientY(clientY) {
  for (const section of document.querySelectorAll('.person-section')) {
    const r = section.getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) return section.dataset.personId;
  }
  return null;
}

// ═══════════════════════════════════════════════
// EDIT POPUP
// ═══════════════════════════════════════════════
function openEdit(barId, clientX, clientY) {
  const bar = state.bars.find(b => b.id === barId);
  if (!bar) return;
  editBarId = barId;
  document.getElementById('edit-label').value = bar.label;
  document.getElementById('edit-status').value = bar.status;
  const popup = document.getElementById('edit-popup');
  popup.classList.remove('hidden');
  popup.style.left = Math.min(clientX, window.innerWidth - 260) + 'px';
  popup.style.top  = Math.min(clientY - 10, window.innerHeight - 150) + 'px';
  document.getElementById('edit-label').focus();
  document.getElementById('edit-label').select();
}
function closeEdit() {
  document.getElementById('edit-popup').classList.add('hidden');
  editBarId = null;
}
function confirmEdit() {
  if (!editBarId) return;
  const bar = state.bars.find(b => b.id === editBarId);
  if (bar) {
    bar.label  = document.getElementById('edit-label').value.trim() || bar.label;
    bar.status = document.getElementById('edit-status').value;
  }
  closeEdit(); saveState(); render();
}

document.getElementById('edit-confirm').addEventListener('click', confirmEdit);
document.getElementById('edit-cancel').addEventListener('click', closeEdit);
document.getElementById('edit-label').addEventListener('keydown', e => {
  if (e.key === 'Enter')  confirmEdit();
  if (e.key === 'Escape') closeEdit();
});

// ═══════════════════════════════════════════════
// EVENT DELEGATION — single mousedown on document
// ═══════════════════════════════════════════════
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;

  // Close edit popup if clicking outside
  const popup = document.getElementById('edit-popup');
  if (!popup.classList.contains('hidden') && !popup.contains(e.target)) closeEdit();

  // ── Add item button ──
  const addBtn = e.target.closest('.add-item-btn');
  if (addBtn) {
    e.preventDefault();
    addBar(addBtn.dataset.personId);
    return;
  }

  // ── Milestone drag ──
  const milPin = e.target.closest('.milestone-pin');
  if (milPin) {
    const wrap = milPin.closest('.milestone-pin-wrap');
    const mid  = wrap && wrap.dataset.milestoneId;
    const m    = mid && state.milestones.find(m => m.id === mid);
    if (m) {
      e.preventDefault();
      milState = { id: mid, startX: e.clientX, origWeek: m.week, origFrac: m.frac || 0 };
    }
    return;
  }

  // ── Resize handle ──
  const resizeHandle = e.target.closest('.resize-handle');
  if (resizeHandle) {
    const barId = resizeHandle.dataset.barId;
    const bar   = state.bars.find(b => b.id === barId);
    if (bar) {
      e.preventDefault();
      resizeState = { barId, startX: e.clientX, origWeeks: bar.weeks };
    }
    return;
  }

  // ── Row drag handle (reorder) ──
  const dragHandle = e.target.closest('.row-drag-handle');
  if (dragHandle) {
    const barId = dragHandle.dataset.barId;
    const bar   = state.bars.find(b => b.id === barId);
    if (bar) {
      e.preventDefault();
      const section = e.target.closest('.person-section');
      const rows = [...(section ? section.querySelectorAll('.bar-row') : [])];
      const origIdx = rows.findIndex(r => r.dataset.barId === barId);
      rowDragState = {
        barId,
        origPerson: bar.personId,
        curPerson: bar.personId,
        origIdx,
        dropIdx: origIdx,
      };
      showGhost(bar, e);
    }
    return;
  }

  // ── Bar drag (date change) ──
  const barEl = e.target.closest('.gantt-bar');
  if (barEl) {
    const barId = barEl.dataset.barId;
    const bar   = state.bars.find(b => b.id === barId);
    if (bar) {
      e.preventDefault();
      const rect = barEl.getBoundingClientRect();
      dragState = {
        barId,
        offsetX: e.clientX - rect.left,
        origWeek: bar.startWeek,
        origPerson: bar.personId,
        curPerson: bar.personId,
      };
      barEl.classList.add('dragging');
      showGhost(bar, e);
    }
    return;
  }

  // ── Collapse toggle ──
  const colBtn = e.target.closest('.collapse-btn');
  if (colBtn) {
    e.preventDefault();
    const pid = colBtn.dataset.personId;
    const p   = state.people.find(p => p.id === pid);
    if (p) { p.collapsed = !p.collapsed; saveState(); render(); }
    return;
  }
  const hrow = e.target.closest('.person-header-row');
  if (hrow && !e.target.closest('.person-name')) {
    const pid = hrow.dataset.personId;
    const p   = state.people.find(p => p.id === pid);
    if (p) { p.collapsed = !p.collapsed; saveState(); render(); }
    return;
  }
});

// ═══════════════════════════════════════════════
// DOUBLE-CLICK DELEGATION — edit bar / person name
// ═══════════════════════════════════════════════
document.addEventListener('dblclick', e => {
  // Edit bar (click on bar or label cell)
  const barEl    = e.target.closest('.gantt-bar:not(.resize-handle)');
  const labelEl  = e.target.closest('.bar-label-cell');
  const barId    = (barEl && barEl.dataset.barId) || (labelEl && labelEl.dataset.barId);
  if (barId) { openEdit(barId, e.clientX, e.clientY); return; }

  // Edit person name
  const nameEl = e.target.closest('.person-name');
  if (nameEl) {
    const pid = nameEl.dataset.personId;
    const p   = state.people.find(p => p.id === pid);
    if (!p) return;
    const input = document.createElement('input');
    input.value = p.name;
    input.style.cssText = 'background:transparent;border:none;border-bottom:1px solid currentColor;color:inherit;font:inherit;width:100px;outline:none;';
    nameEl.replaceWith(input);
    input.focus(); input.select();
    const commit = () => {
      p.name = input.value.trim() || p.name;
      saveState(); render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { render(); } // cancel
    });
    return;
  }
});

// ═══════════════════════════════════════════════
// MOUSEMOVE
// ═══════════════════════════════════════════════
document.addEventListener('mousemove', e => {
  const roadmap = document.getElementById('roadmap');
  const rr = roadmap.getBoundingClientRect();

  if (dragState) {
    moveGhost(e);
    const rawX = e.clientX - rr.left + roadmap.scrollLeft - LEFT_W;
    const newWeek = Math.max(0, Math.min(TOTAL_WEEKS - 1,
      Math.round((rawX - dragState.offsetX) / WEEK_W)
    ));
    const bar = state.bars.find(b => b.id === dragState.barId);
    if (bar) {
      bar.startWeek = Math.max(0, Math.min(TOTAL_WEEKS - bar.weeks, newWeek));
      const el = document.querySelector(`.gantt-bar[data-bar-id="${bar.id}"]`);
      if (el) el.style.left = (bar.startWeek * WEEK_W + 2) + 'px';
    }
    const newPerson = personAtClientY(e.clientY);
    if (newPerson && newPerson !== dragState.curPerson) {
      document.querySelectorAll('.person-section').forEach(s => s.classList.remove('drop-target'));
      document.querySelector(`.person-section[data-person-id="${newPerson}"]`)?.classList.add('drop-target');
      dragState.curPerson = newPerson;
    }
  }

  if (rowDragState) {
    moveGhost(e);
    const newPerson = personAtClientY(e.clientY);
    if (newPerson) {
      rowDragState.curPerson = newPerson;
      document.querySelectorAll('.person-section').forEach(s => s.classList.remove('drop-target'));
      if (newPerson !== rowDragState.origPerson) {
        document.querySelector(`.person-section[data-person-id="${newPerson}"]`)?.classList.add('drop-target');
      }
    }
    rowDragState.dropIdx = getDropRowIndex(rowDragState.curPerson, e.clientY);
    // Position drop indicator between rows
    const section = document.querySelector(`.person-section[data-person-id="${rowDragState.curPerson}"]`);
    const rows = section ? [...section.querySelectorAll('.bar-row')] : [];
    let indicatorY;
    if (rows.length === 0) {
      const hRect = section ? section.querySelector('.person-header-row').getBoundingClientRect() : null;
      indicatorY = hRect ? hRect.bottom : e.clientY;
    } else if (rowDragState.dropIdx >= rows.length) {
      indicatorY = rows[rows.length - 1].getBoundingClientRect().bottom;
    } else {
      indicatorY = rows[rowDragState.dropIdx].getBoundingClientRect().top;
    }
    showDropIndicator(indicatorY);
  }

  if (resizeState) {
    const dx = e.clientX - resizeState.startX;
    const bar = state.bars.find(b => b.id === resizeState.barId);
    if (bar) {
      bar.weeks = Math.max(1, resizeState.origWeeks + Math.round(dx / WEEK_W));
      const el = document.querySelector(`.gantt-bar[data-bar-id="${bar.id}"]`);
      if (el) el.style.width = Math.max(WEEK_W - 4, bar.weeks * WEEK_W - 4) + 'px';
    }
  }

  if (milState) {
    const rawX = e.clientX - rr.left + roadmap.scrollLeft - LEFT_W;
    const total = rawX / WEEK_W;
    const m = state.milestones.find(m => m.id === milState.id);
    if (m) {
      m.week = Math.max(0, Math.min(TOTAL_WEEKS - 1, Math.floor(total)));
      m.frac = Math.max(0, Math.min(0.99, total - m.week));
      const wrap = document.querySelector(`.milestone-pin-wrap[data-milestone-id="${m.id}"]`);
      if (wrap) wrap.style.left = ((m.week + m.frac) * WEEK_W) + 'px';
    }
  }
});

// ═══════════════════════════════════════════════
// MOUSEUP
// ═══════════════════════════════════════════════
document.addEventListener('mouseup', () => {
  if (dragState) {
    document.querySelectorAll('.person-section').forEach(s => s.classList.remove('drop-target'));
    const bar = state.bars.find(b => b.id === dragState.barId);
    if (bar && dragState.curPerson) bar.personId = dragState.curPerson;
    hideGhost();
    dragState = null;
    saveState(); render();
  }

  if (rowDragState) {
    hideDropIndicator();
    document.querySelectorAll('.person-section').forEach(s => s.classList.remove('drop-target'));
    hideGhost();
    const { barId, origPerson, curPerson, dropIdx } = rowDragState;
    rowDragState = null;

    const bar = state.bars.find(b => b.id === barId);
    if (bar) {
      // Remove bar from current position
      const idx = state.bars.indexOf(bar);
      state.bars.splice(idx, 1);
      bar.personId = curPerson;

      // Find insertion position among bars of target person
      const personBars = state.bars.filter(b => b.personId === curPerson);
      const insertAfter = personBars[dropIdx - 1];
      const insertBefore = personBars[dropIdx];

      if (insertBefore) {
        const insertIdx = state.bars.indexOf(insertBefore);
        state.bars.splice(insertIdx, 0, bar);
      } else if (insertAfter) {
        const insertIdx = state.bars.indexOf(insertAfter) + 1;
        state.bars.splice(insertIdx, 0, bar);
      } else {
        // Target person has no bars or drop at end
        const lastPersonBar = state.bars.slice().reverse().find(b => b.personId === curPerson);
        if (lastPersonBar) {
          state.bars.splice(state.bars.indexOf(lastPersonBar) + 1, 0, bar);
        } else {
          state.bars.push(bar);
        }
      }
    }
    saveState(); render();
  }

  if (resizeState) {
    resizeState = null;
    saveState();
  }
  if (milState) {
    milState = null;
    saveState(); render();
  }
});

// ═══════════════════════════════════════════════
// EXPORT / RESET
// ═══════════════════════════════════════════════
document.getElementById('export-btn').addEventListener('click', () => window.print());
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Reset roadmap to defaults? All changes will be lost.')) {
    state = JSON.parse(JSON.stringify(DEFAULT));
    saveState(); render();
  }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();

setTimeout(() => {
  const roadmap = document.getElementById('roadmap');
  roadmap.scrollLeft = Math.max(0, LEFT_W + todayOffset() * WEEK_W - 300);
}, 50);
</script>
</body>
