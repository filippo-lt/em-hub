# Amplitude credentials map — paired with config.conf by FRIENDLY_NAME.
# Consumed by scripts/gcp-spend/amplitude.py.
#
# Format:  FRIENDLY_NAME | REGION | API_KEY_ENV | SECRET_KEY_ENV
#   FRIENDLY_NAME   must match config.conf exactly
#   REGION          eu | us  (Amplitude data residency)
#   API_KEY_ENV     name of the env var holding the project's API key
#   SECRET_KEY_ENV  name of the env var holding the project's secret key
#
# Env vars are loaded from .env at the repo root. Apps not listed here are
# skipped silently (their cards show "—" for MAU).

Tattooist        | eu | AMPLITUDE_TATTOOIST_KEY       | AMPLITUDE_TATTOOIST_SECRET
