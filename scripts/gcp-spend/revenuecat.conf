# RevenueCat revenue — app → project + credential mapping.
# Consumed by scripts/gcp-spend/revenuecat.py
#
# Format:  FRIENDLY_NAME | REVENUECAT_PROJECT_ID | API_KEY_ENV_VAR
#
# FRIENDLY_NAME must match config.conf exactly — it is the join key across
# billing, Amplitude and RevenueCat.
#
# Secrets live in .env (gitignored), never here. The env var naming follows the
# convention already used by scripts/ma-heartbeat: <APP>_REVENUECAT_API_KEY.
#
# Leave PROJECT_ID empty for an app you don't have access to yet — it is skipped
# with a warning and the report renders exactly as it did before.
#
# The Charts API requires a RevenueCat Pro plan and a secret key (sk_...).

